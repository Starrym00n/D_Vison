<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440">
<rect width="1100" height="440" fill="white"/>
<g font-family="Arial,sans-serif" fill="#172b4d">
<text x="40" y="32" font-size="22">Dynamic V ROI — column-by-column masking</text>
<g transform="translate(50,80) scale(2)">
<rect x="16" width="288" height="132" fill="#e8f5e9" stroke="#238636"/>
<path d="M16 57L304 100.2V132H16Z" fill="#cbd5e1"/>
<rect x="16" width="288" height="100" fill="none" stroke="#dc2626" stroke-dasharray="4 2"/>
<path d="M16 60L304 103.2" stroke="#172b4d" stroke-width="1.5"/>
<path d="M16 57L304 100.2" stroke="#d97706" stroke-width="1.2"/>
<path d="M208 0V132" stroke="#9333ea" stroke-dasharray="3 2"/>
</g>
<g font-size="15">
<text x="95" y="110">Preserved pixels above cut_y(x)</text>
<text x="220" y="325">Pixels set to zero below cut_y(x)</text>
<text x="718" y="105">Example: y(x)=60+0.15(x-16)</text>
<text x="718" y="145" fill="#172b4d">Black: fitted line</text>
<text x="718" y="180" fill="#d97706">Orange: cut_y=int(y)-3</text>
<text x="718" y="215" fill="#dc2626">Red: V ROI bounding rectangle</text>
<text x="718" y="250">At x=16: cut_y=57</text>
<text x="718" y="280">At x=303: cut_y=100</text>
<text x="718" y="310">V ROI: [16, 0, 288, 100]</text>
<text x="50" y="385">The rectangular ROI includes masked pixels. Its bottom is not the actual sloped boundary.</text>
<text x="50" y="415">Illustration smooths the boundary; implementation truncates y separately for each pixel column.</text>
</g></g></svg>
